<!-- Example for /home/slug/repos/Alis_2/app_pi/web/upload.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Alis Display</title>
    <link rel="icon" href="/assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222831;
            min-height: 100vh;
        }
        .header {
            width: 100vw;
            background: #2979ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 2em;
            margin: 2em 0 1em 0;
        }
        .top-buttons button {
            padding: 1em 2em;
            font-size: 1.5em;
            border-radius: 0.8em;
            border: none;
            background: #2979ff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-buttons button.active {
            background: #1565c0;
            border: 2px solid #fff;
        }
        .top-buttons button:last-child {
            margin-bottom: 1em;
        }
        .list-container {
            max-height: 60vh;
            overflow-y: auto;
            margin: 0 auto;
            width: 90vw;
            background: #393e46;
            border-radius: 1em;
            padding: 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .image-list {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        .image-item {
            display: flex;
            align-items: center;
            gap: 1em;
            background: #23272f;
            border-radius: 0.5em;
            padding: 0.5em 1em;
        }
        .image-item img {
            width: 64px;
            height: 64px;
            border-radius: 0.5em;
            background: #111;
            object-fit: contain;
            border: 2px solid #2979ff;
        }
        .image-item span {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        .size-filter-container {
            position: fixed;
            top: 20px;
            right: 16px;
            z-index: 10;
            background: rgba(41,121,255,0.95);
            border-radius: 0.5em;
            padding: 0.5em 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
        }
        .size-filter-container label {
            color: #fff;
            font-weight: bold;
            margin-right: 0.5em;
        }
        .size-filter-container select {
            font-size: 1.2em;
            border-radius: 0.5em;
            padding: 0.2em;
            border: none;
            background: #fff;
            color: #222831;
        }

        @media (max-width: 600px) {
            .top-buttons {
                flex-direction: column;
                gap: 1em;
                margin: 1em 0 0 0;
                align-items: stretch;
            }
            .top-buttons button {
                font-size: 1em;
                padding: 0.7em 0.5em;
                border-radius: 0.5em;
                width: 90vw;
                max-width: 350px;
                margin: 0 auto;
            }
            .header {
                height: 56px;
                font-size: 1.2em;
            }
            .size-filter-container {
                top: 8px;
                right: 8px;
                padding: 0.3em 0.6em;
            }
            .size-filter-container select {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/web/home.html">Alis</a>
    </div>
    <div class="top-buttons">
        <button id="staticBtn" class="active">Static</button>
        <button id="animationBtn">Animation</button>
        <button id="textBtn">Text</button>
    </div>
    <div class="size-filter-container">
        <label for="sizeFilter">Size:</label>
        <select id="sizeFilter">
            <option value="all">All</option>
            <!-- Sizes will be populated by JS -->
        </select>
    </div>
    <div class="list-container" id="staticList">
        <div class="image-list" id="imageList">
            <!-- Images will be loaded here -->
        </div>
    </div>
    <div class="list-container hidden" id="animationList">
        <div class="image-list" id="animationImageList">
            <!-- Animations will be loaded here -->
        </div>
    </div>
    <div class="list-container hidden" id="textEntryForm" style="margin-bottom:1em; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
        <div style="display:flex; flex-direction:column; gap:1em;">
            <label for="textName" style="color:#ffd600; font-weight:bold;">Text to Display</label>
            <input type="text" id="textName" placeholder="Enter text..." maxlength="64" style="font-size:1.2em; border-radius:0.5em; border:none; padding:0.6em;">
            
            <div style="display:flex; gap:1em;">
                <div style="flex:1;">
                    <label for="textWidth" style="color:#ffd600; font-weight:bold;">Width</label>
                    <input type="number" id="textWidth" placeholder="Width" min="1" max="128" style="font-size:1.2em; border-radius:0.5em; border:none; padding:0.6em;">
                </div>
                <div style="flex:1;">
                    <label for="textHeight" style="color:#ffd600; font-weight:bold;">Height</label>
                    <input type="number" id="textHeight" placeholder="Height" min="1" max="128" style="font-size:1.2em; border-radius:0.5em; border:none; padding:0.6em;">
                </div>
            </div>
            
            <div style="display:flex; gap:1em;">
                <div style="flex:1;">
                    <label for="textFontSize" style="color:#ffd600; font-weight:bold;">Font Size</label>
                    <input type="number" id="textFontSize" placeholder="42" min="8" max="128" style="font-size:1.2em; border-radius:0.5em; border:none; padding:0.6em;">
                </div>
                <div style="flex:1;">
                    <label for="textScrollSpeed" style="color:#ffd600; font-weight:bold;">Scroll Speed</label>
                    <input type="number" id="textScrollSpeed" placeholder="2" min="1" max="30" style="font-size:1.2em; border-radius:0.5em; border:none; padding:0.6em;">
                </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:1em;">
                <label for="textColor" style="color:#ffd600; font-weight:bold;">Color</label>
                <input type="color" id="textColor" value="#ffd600" style="height:2.5em; width:2.5em; border-radius:0.5em; border:none;">
            </div>
            
            <div style="display:flex; gap:1em;">
                <button id="testTextBtn" style="flex:1; background:#2979ff; color:#fff; font-size:1.2em; border-radius:0.5em; border:none; padding:0.7em; font-weight:bold;">Test</button>
                <button id="saveTextBtn" style="flex:1; background:#ffd600; color:#222831; font-size:1.2em; border-radius:0.5em; border:none; padding:0.7em; font-weight:bold;">Save</button>
            </div>
            <div id="textEntryError" style="color:#ff1744; font-weight:bold; display:none;"></div>
        </div>
    </div>
    <div class="list-container hidden" id="textList">
        <div class="image-list" id="textImageList">
            <!-- Text entries will be loaded here -->
        </div>
    </div>
    <script>
        // Button toggle logic
        const staticBtn = document.getElementById("staticBtn");
        const animationBtn = document.getElementById("animationBtn");
        const textBtn = document.getElementById("textBtn");
        const staticList = document.getElementById("staticList");
        const animationList = document.getElementById("animationList");
        const textEntryForm = document.getElementById("textEntryForm");

        staticBtn.onclick = () => {
            staticBtn.classList.add("active");
            animationBtn.classList.remove("active");
            textBtn.classList.remove("active");
            staticList.classList.remove("hidden");
            animationList.classList.add("hidden");
            textList.classList.add("hidden");
            textEntryForm.classList.add("hidden");
        };
        animationBtn.onclick = () => {
            animationBtn.classList.add("active");
            staticBtn.classList.remove("active");
            textBtn.classList.remove("active");
            animationList.classList.remove("hidden");
            staticList.classList.add("hidden");
            textList.classList.add("hidden");
            textEntryForm.classList.add("hidden");
        };
        textBtn.onclick = () => {
            textBtn.classList.add("active");
            staticBtn.classList.remove("active");
            animationBtn.classList.remove("active");
            textList.classList.remove("hidden");
            textEntryForm.classList.remove("hidden");
            staticList.classList.add("hidden");
            animationList.classList.add("hidden");
        };

        let allImages = [];
        let allAnimations = [];
        let allText = [];
        let availableSizes = new Set();

        // Load image list from backend
        async function loadImages() {
            const response = await fetch("/api/image_list");
            if (!response.ok) return;
            allImages = await response.json();
            allImages.forEach(img => {
                availableSizes.add(`${img.width}x${img.height}`);
            });
            renderImages();
            populateSizeFilter();
        }

        // Load animation list from backend
        async function loadAnimations() {
            const response = await fetch("/api/animation_list");
            if (!response.ok) return;
            allAnimations = await response.json();
            allAnimations.forEach(anim => {
                availableSizes.add(`${anim.width}x${anim.height}`);
            });
            renderAnimations();
            populateSizeFilter();
        }

        // Load text list from backend
        async function loadText() {
            const response = await fetch("/api/text_list");
            if (!response.ok) return;
            allText = await response.json();
            allText.forEach(txt => {
                availableSizes.add(`${txt.width}x${txt.height}`);
            });
            renderText();
            populateSizeFilter();
        }

        function renderImages() {
            const imageList = document.getElementById("imageList");
            imageList.innerHTML = "";
            const selectedSize = document.getElementById("sizeFilter").value;
            allImages
                .filter(img => selectedSize === "all" || `${img.width}x${img.height}` === selectedSize)
                .forEach(img => {
                    const item = document.createElement("div");
                    item.className = "image-item";
                    item.style.cursor = "pointer";
                    const preview = document.createElement("img");
                    preview.src = img.preview_url;
                    preview.alt = img.name;
                    const name = document.createElement("span");
                    name.textContent = `${img.name.replace(/\.h5$/, "")} (${img.width}x${img.height})`;
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.onclick = async () => {
                        item.style.background = "#2979ff";
                        item.style.color = "#fff";
                        await fetch("/api/run_image", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({name: img.name})
                        });
                        // Remove highlight right after sending
                        item.style.background = "";
                        item.style.color = "";
                    };
                    imageList.appendChild(item);
                });
        }

        function renderAnimations() {
            const animationImageList = document.getElementById("animationImageList");
            animationImageList.innerHTML = "";
            const selectedSize = document.getElementById("sizeFilter").value;
            allAnimations
                .filter(anim => selectedSize === "all" || `${anim.width}x${anim.height}` === selectedSize)
                .forEach(anim => {
                    const item = document.createElement("div");
                    item.className = "image-item";
                    item.style.cursor = "pointer";
                    const preview = document.createElement("img");
                    preview.src = anim.preview_url;
                    preview.alt = anim.name;
                    const name = document.createElement("span");
                    name.textContent = `${anim.name.replace(/\.h5$/, "")} (${anim.width}x${anim.height})`;
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.onclick = async () => {
                        item.style.background = "#2979ff";
                        item.style.color = "#fff";
                        await fetch("/api/run_animation", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({name: anim.name})
                        });
                        item.style.background = "";
                        item.style.color = "";
                    };
                    animationImageList.appendChild(item);
                });
        }

        function renderText() {
            const textImageList = document.getElementById("textImageList");
            textImageList.innerHTML = "";
            const selectedSize = document.getElementById("sizeFilter").value;
            allText
                .filter(txt => selectedSize === "all" || `${txt.width}x${txt.height}` === selectedSize)
                .forEach(txt => {
                    const item = document.createElement("div");
                    item.className = "image-item";
                    item.style.cursor = "pointer";
                    // Show name and all info
                    const info = document.createElement("span");
                    info.style.color = "#fff";
                    info.style.fontSize = "1.2em";
                    info.style.fontWeight = "bold";
                    info.textContent =
                        `${txt.name} (${txt.width}x${txt.height}) | ` +
                        `Color: ${txt.color || "#ffd600"} | ` +
                        `Font: ${txt["font size"] || "42"} | ` +
                        `Scroll: ${txt["scroll speed"] || "2"}`;
                    item.appendChild(info);
                    item.onclick = async () => {
                        item.style.background = "#2979ff";
                        item.style.color = "#fff";
                        await fetch("/api/run_text", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({name: txt.name})
                        });
                        item.style.background = "";
                        item.style.color = "";
                    };
                    textImageList.appendChild(item);
                });
        }

        function populateSizeFilter() {
            const sizeFilter = document.getElementById("sizeFilter");
            // Only add sizes if not already populated
            if (sizeFilter.options.length > 1) return;
            Array.from(availableSizes).sort().forEach(size => {
                const option = document.createElement("option");
                option.value = size;
                option.textContent = size;
                sizeFilter.appendChild(option);
            });
        }

        document.getElementById("sizeFilter").onchange = () => {
            renderImages();
            renderAnimations();
            renderText();
        };

        async function testTextEntry() {
            const name = document.getElementById("textName").value.trim();
            const width = parseInt(document.getElementById("textWidth").value);
            const height = parseInt(document.getElementById("textHeight").value);
            const color = document.getElementById("textColor").value;
            const fontSize = parseInt(document.getElementById("textFontSize").value);
            const scrollSpeed = parseInt(document.getElementById("textScrollSpeed").value);

            if (!name || !width || !height || !fontSize || !scrollSpeed) {
                return showTextEntryError("All fields are required.");
            }

            await fetch("/api/test_text", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    name,
                    width,
                    height,
                    color,
                    "font size": fontSize,
                    "scroll speed": scrollSpeed
                })
            });
        }

        async function saveTextEntry() {
            const name = document.getElementById("textName").value.trim();
            const width = parseInt(document.getElementById("textWidth").value);
            const height = parseInt(document.getElementById("textHeight").value);
            const color = document.getElementById("textColor").value;
            const fontSize = parseInt(document.getElementById("textFontSize").value);
            const scrollSpeed = parseInt(document.getElementById("textScrollSpeed").value);

            if (!name || !width || !height || !fontSize || !scrollSpeed) {
                return showTextEntryError("All fields are required.");
            }

            // Save to backend
            const entry = {
                name,
                width,
                height,
                color,
                "font size": fontSize,
                "scroll speed": scrollSpeed
            };
            const res = await fetch("/api/save_text_entry", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(entry)
            });
            if (res.ok) {
                document.getElementById("textName").value = "";
                document.getElementById("textWidth").value = "";
                document.getElementById("textHeight").value = "";
                document.getElementById("textFontSize").value = "";
                document.getElementById("textScrollSpeed").value = "";
                showTextEntryError(""); // Clear error
                loadText(); // Reload list
            } else {
                showTextEntryError("Failed to save entry (duplicate name?)");
            }
        }

        function showTextEntryError(msg) {
            const err = document.getElementById("textEntryError");
            err.textContent = msg;
            err.style.display = msg ? "block" : "none";
        }

        document.getElementById("testTextBtn").onclick = testTextEntry;
        document.getElementById("saveTextBtn").onclick = saveTextEntry;

        // Initial load
        loadImages();
        loadAnimations();
        loadText();
    </script>
</body>
</html>
