<!DOCTYPE html>
<html>
<head>
    <title>Alis</title>
    <link rel="icon" href="/assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222831;
            min-height: 100vh;
        }
        .header {
            width: 100vw;
            background: #2979ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        #container { display: flex; flex-direction: column; height: 100vh; }
        #drawCanvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #333;
            background: #646464;
            touch-action: none;
            width: 600px;
            height: 600px;
            max-width: 100vw;
            max-height: 60vh;
        }
        #controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            padding: 20px 0 10px 0;
            background: #222831;
            gap: 20px;
        }
        #colorPicker { width: 120px; height: 60px; }
        #clearBtn { padding: 18px 32px; font-size: 1.2em; }
        #buttonDraw { width: 90vw; max-width: 500px; padding: 30px; font-size: 2em; margin: 10px auto 0 auto; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/web/home.html">Alis</a>
    </div>
    <div id="container">
        <canvas id="drawCanvas" width="600" height="600"></canvas>
        <div id="controls">
            <input type="color" id="colorPicker" value="#ff0000">
            <button id="clearBtn">Clear Canvas</button>
        </div>
        <button id="buttonDraw">Restart Draw Mode</button>
    </div>
    <script>
        let ws = null;
        let color = "#ff0000";
        const button = document.getElementById("buttonDraw");
        const colorPicker = document.getElementById("colorPicker");
        const clearBtn = document.getElementById("clearBtn");
        const canvas = document.getElementById("drawCanvas");
        const size = Math.min(window.innerWidth, window.innerHeight * 0.6, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        const ctx = canvas.getContext("2d");
        let drawing = false;
        let lastSent = 0;

        function startWebSocket() {
            if (ws) {
                ws.close();
            }
            ws = new WebSocket("ws://" + location.host + "/wsdraw");
            ws.onopen = () => console.log("WebSocket started");
            ws.onmessage = (msg) => console.log("Server:", msg.data);
        }

        button.onclick = () => {
            console.log("draw mode");
            fetch("/api/drawmode", {method: "POST"});
            startWebSocket();
        };

        window.onload = () => {
            startWebSocket();
        };

        colorPicker.oninput = (e) => {
            color = colorPicker.value;
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({type: "color", color: color}));
            }
        };

        clearBtn.onclick = () => {
            // Clear the canvas visually
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Send clear message to backend
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({type: "clear"}));
            }
            // TODO: Hook up to other backend code here for full LED clear
        };

        function sendDraw(x, y) {
            const now = Date.now();
            if (now - lastSent < 50) return; // Only send every x ms
            lastSent = now;
            let mx = Math.round(x / canvas.width * 100);
            let my = Math.round(y / canvas.height * 100);
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({type: "draw", x: mx, y: my, color: color}));
            }
        }

        canvas.addEventListener("mousedown", e => {
            drawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, 2 * Math.PI);
            ctx.fill();
            // sendDraw(x, y);  // <--- REMOVE THIS LINE
        });

        canvas.addEventListener("mousemove", e => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, 2 * Math.PI);
            ctx.fill();
            // sendDraw(x, y);  // <--- REMOVE THIS LINE
        });

        canvas.addEventListener("mouseup", e => {
            drawing = false;
            sendMatrix();
        });
        canvas.addEventListener("mouseleave", e => {
            drawing = false;
            sendMatrix();
        });

        // Touch support
        canvas.addEventListener("touchstart", e => {
            drawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, 2 * Math.PI);
            ctx.fill();
            // sendDraw(x, y);  // <--- REMOVE THIS LINE
        });
        canvas.addEventListener("touchmove", e => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, 2 * Math.PI);
            ctx.fill();
            // sendDraw(x, y);  // <--- REMOVE THIS LINE
            e.preventDefault();
        });
        canvas.addEventListener("touchend", e => {
            drawing = false;
            sendMatrix();
        });
        canvas.addEventListener("touchcancel", e => {
            drawing = false;
            sendMatrix();
        });

        function getMatrix(gridW, gridH) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const matrix = [];
            const cellW = canvas.width / gridW;
            const cellH = canvas.height / gridH;
            for (let gx = 0; gx < gridW; gx++) {
                const row = [];
                for (let gy = 0; gy < gridH; gy++) {
                    // Sample center pixel of each cell
                    const px = Math.floor((gx + 0.5) * cellW);
                    const py = Math.floor((gy + 0.5) * cellH);
                    const idx = (py * canvas.width + px) * 4;
                    const r = imageData[idx];
                    const g = imageData[idx + 1];
                    const b = imageData[idx + 2];
                    row.push([r, g, b]);
                }
                matrix.push(row);
            }
            return matrix;
        }

        function sendMatrix() {
            const matrix = getMatrix(14, 50); // or your grid size
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({type: "matrix", matrix: matrix}));
            }
        }
    </script>
</body>
</html>
