<!DOCTYPE html>
<html>
<head>
    <title>Test - Alis</title>
    <link rel="icon" href="/assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222831;
            min-height: 100vh;
        }
        .header {
            width: 100vw;
            background: #2979ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 2em;
        }
        .main-content button {
            padding: 1.5em 3em;
            font-size: 2em;
            border-radius: 1em;
            border: none;
            background: #4a90e2;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        .main-content button:hover {
            background: #357abd;
        }
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1em;
            padding: 1em 3em;
            background: #174ea6;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            box-sizing: border-box;
        }
        .bottom-bar button {
            padding: 0.6em 1.2em;
            font-size: 1em;
            border-radius: 0.6em;
            border: none;
            background: #333;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 0.5em;
            margin-right: 0.5em;
            min-width: 100px;
        }
        .bottom-bar button:hover {
            background: #357abd;
        }
        @media (max-width: 600px) {
            .main-content button {
                width: 90vw;
                max-width: none;
                font-size: 1.3em;
                padding: 1.2em;
                margin-bottom: 1em;
            }
            .bottom-bar {
                flex-direction: row;
                gap: 0.5em;
                padding: 0.8em 0;
                height: auto;
            }
            .bottom-bar button {
                width: auto;
                font-size: 1em;
                padding: 0.6em 1em;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/web/home.html">Alis</a>
    </div>
    <div class="main-content">
        <button id="runTestBtn">Run Test</button>
        <div id="testStatus" style="color:#fff;font-size:1.2em;"></div>
    </div>
    <div class="bottom-bar">
        <button onclick="location.href='/web/settings.html'">Settings</button>
        <button onclick="location.href='/web/home.html'">Home</button>
        <button onclick="location.href='/web/upload.html'">Upload</button>
    </div>
    <script>
        document.getElementById("runTestBtn").onclick = async function() {
            const status = document.getElementById("testStatus");
            status.textContent = "Running test...";
            try {
                // Replace '/api/run_test' with your actual endpoint
                const resp = await fetch('/api/run_test', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    status.textContent = data.message || "Test completed!";
                } else {
                    status.textContent = "Test failed to start.";
                }
            } catch (e) {
                status.textContent = "Error: " + e;
            }
        };
    </script>
</body>
</html>
