<!DOCTYPE html>
<html>
<head>
    <title>Alis Display</title>
    <link rel="icon" href="/assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222831;
            min-height: 100vh;
        }
        .header {
            width: 100vw;
            background: #2979ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 2em;
            margin: 2em 0 1em 0;
        }
        .top-buttons button {
            padding: 1em 2em;
            font-size: 1.5em;
            border-radius: 0.8em;
            border: none;
            background: #2979ff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-buttons button.active {
            background: #1565c0;
            border: 2px solid #fff;
        }
        .list-container {
            max-height: 60vh;
            overflow-y: auto;
            margin: 0 auto;
            width: 90vw;
            background: #393e46;
            border-radius: 1em;
            padding: 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .image-list {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        .image-item {
            display: flex;
            align-items: center;
            gap: 1em;
            background: #23272f;
            border-radius: 0.5em;
            padding: 0.5em 1em;
        }
        .image-item img {
            width: 64px;
            height: 64px;
            border-radius: 0.5em;
            background: #111;
            object-fit: contain;
            border: 2px solid #2979ff;
        }
        .image-item span {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/web/home.html">Alis</a>
    </div>
    <div class="top-buttons">
        <button id="staticBtn" class="active">Static</button>
        <button id="animationBtn">Animation</button>
    </div>
    <div style="position:absolute; top:20px; right:30px;">
        <label for="sizeFilter" style="color:#fff; font-weight:bold;">Size:</label>
        <select id="sizeFilter" style="font-size:1.2em; border-radius:0.5em; padding:0.2em;">
            <option value="all">All</option>
            <!-- Sizes will be populated by JS -->
        </select>
    </div>
    <div class="list-container" id="staticList">
        <div class="image-list" id="imageList">
            <!-- Images will be loaded here -->
        </div>
    </div>
    <div class="list-container hidden" id="animationList">
        <div class="image-list" id="animationImageList">
            <!-- Animations will be loaded here -->
        </div>
    </div>
    <script>
        // Button toggle logic
        const staticBtn = document.getElementById("staticBtn");
        const animationBtn = document.getElementById("animationBtn");
        const staticList = document.getElementById("staticList");
        const animationList = document.getElementById("animationList");

        staticBtn.onclick = () => {
            staticBtn.classList.add("active");
            animationBtn.classList.remove("active");
            staticList.classList.remove("hidden");
            animationList.classList.add("hidden");
        };
        animationBtn.onclick = () => {
            animationBtn.classList.add("active");
            staticBtn.classList.remove("active");
            animationList.classList.remove("hidden");
            staticList.classList.add("hidden");
        };

        let allImages = [];
        let allAnimations = [];
        let availableSizes = new Set();

        // Load image list from backend
        async function loadImages() {
            const response = await fetch("/api/image_list");
            if (!response.ok) return;
            allImages = await response.json();
            allImages.forEach(img => {
                availableSizes.add(`${img.width}x${img.height}`);
            });
            renderImages();
            populateSizeFilter();
        }

        // Load animation list from backend
        async function loadAnimations() {
            const response = await fetch("/api/animation_list");
            if (!response.ok) return;
            allAnimations = await response.json();
            allAnimations.forEach(anim => {
                availableSizes.add(`${anim.width}x${anim.height}`);
            });
            renderAnimations();
            populateSizeFilter();
        }

        function renderImages() {
            const imageList = document.getElementById("imageList");
            imageList.innerHTML = "";
            const selectedSize = document.getElementById("sizeFilter").value;
            allImages
                .filter(img => selectedSize === "all" || `${img.width}x${img.height}` === selectedSize)
                .forEach(img => {
                    const item = document.createElement("div");
                    item.className = "image-item";
                    item.style.cursor = "pointer";
                    const preview = document.createElement("img");
                    preview.src = img.preview_url;
                    preview.alt = img.name;
                    const name = document.createElement("span");
                    name.textContent = `${img.name.replace(/\.h5$/, "")} (${img.width}x${img.height})`;
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.onclick = async () => {
                        item.style.background = "#2979ff";
                        item.style.color = "#fff";
                        await fetch("/api/run_image", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({name: img.name})
                        });
                    };
                    imageList.appendChild(item);
                });
        }

        function renderAnimations() {
            const animationImageList = document.getElementById("animationImageList");
            animationImageList.innerHTML = "";
            const selectedSize = document.getElementById("sizeFilter").value;
            allAnimations
                .filter(anim => selectedSize === "all" || `${anim.width}x${anim.height}` === selectedSize)
                .forEach(anim => {
                    const item = document.createElement("div");
                    item.className = "image-item";
                    item.style.cursor = "pointer";
                    const preview = document.createElement("img");
                    preview.src = anim.preview_url;
                    preview.alt = anim.name;
                    const name = document.createElement("span");
                    name.textContent = `${anim.name.replace(/\.h5$/, "")} (${anim.width}x${anim.height})`;
                    item.appendChild(preview);
                    item.appendChild(name);
                    item.onclick = async () => {
                        item.style.background = "#2979ff";
                        item.style.color = "#fff";
                        await fetch("/api/run_animation", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({name: anim.name})
                        });
                    };
                    animationImageList.appendChild(item);
                });
        }

        function populateSizeFilter() {
            const sizeFilter = document.getElementById("sizeFilter");
            // Only add sizes if not already populated
            if (sizeFilter.options.length > 1) return;
            Array.from(availableSizes).sort().forEach(size => {
                const option = document.createElement("option");
                option.value = size;
                option.textContent = size;
                sizeFilter.appendChild(option);
            });
        }

        document.getElementById("sizeFilter").onchange = () => {
            renderImages();
            renderAnimations();
        };

        // Initial load
        loadImages();
        loadAnimations();
    </script>
</body>
</html>
