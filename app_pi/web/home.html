<!DOCTYPE html>
<html>
<head>
    <title>Alis Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222831;
            min-height: 100vh;
        }
        .header {
            width: 100vw;
            background: #2979ff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        h1 {
            font-size: 5em;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        .main-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2em;
            margin-top: 2em;
            flex: 1;
        }
        .main-buttons button {
            width: 70vw;
            max-width: 400px;
            padding: 2em;
            font-size: 2em;
            border-radius: 1em;
            border: none;
            background: #4a90e2;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        .main-buttons button:hover {
            background: #357abd;
        }
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5em 2em;
            background: #eee;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            box-sizing: border-box;
        }
        .bottom-bar button {
            padding: 1em 2em;
            font-size: 1.5em;
            border-radius: 0.8em;
            border: none;
            background: #333;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bottom-bar button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/web/home.html">Alis</a>
    </div>
    <div class="main-buttons">
        <button id="showsBtn">Shows</button>
        <button id="displayBtn">Display</button>
        <button id="drawBtn">Draw</button>
        <button id="createBtn">Create/Modify</button>
    </div>
    <div class="bottom-bar">
        <button id="settingsBtn">Settings</button>
        <button id="uploadBtn">Upload</button>
    </div>
    <script>
        document.getElementById("showsBtn").onclick = () => location.href = "/web/shows.html";
        document.getElementById("displayBtn").onclick = () => location.href = "/web/display.html";
        document.getElementById("drawBtn").onclick = () => location.href = "/web/draw.html";
        document.getElementById("createBtn").onclick = () => location.href = "/web/create.html";
        document.getElementById("settingsBtn").onclick = () => location.href = "/web/settings.html";
        document.getElementById("uploadBtn").onclick = () => location.href = "/web/upload.html";
    </script>
</body>
</html>
